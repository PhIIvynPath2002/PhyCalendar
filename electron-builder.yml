appId: com.phycalendar.personal
productName: PhyCalendar
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  icon: public/icon-512.png
  identity: "-"
  target:
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
artifactName: PhyCalendar-${version}-macOS-${arch}-unsigned.${ext}
